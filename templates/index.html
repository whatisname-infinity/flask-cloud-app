<!DOCTYPE html>
<html>
<head>
    <title>Amit's Cloud Dashboard</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; }
        .container { background: white; padding: 50px; margin: 50px auto; width: 50%; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        p { color: #555; font-size: 18px; }
        .footer { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ Cloud Dashboard</h1>
        <p>Welcome, <b>{{ user_name }}</b>!</p>
        <p>Server Time: <b>{{ server_time }}</b></p>
        <p>This page is being served from your <b>Ubuntu Server</b>.</p>
        <div class="footer">Status: Online | Region: Pune</div>
    </div>
</body>
</html>
