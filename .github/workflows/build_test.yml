name: CI - Build Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Test Build
      uses: docker/setup-buildx-action@v4
      with:
        context: .
        push: false 
        tags: my-flask-app:test
